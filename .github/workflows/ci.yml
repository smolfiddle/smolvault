name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: compile check
        run: |
          python -m py_compile smolvault.py benchmark.py
      - name: quick benchmark smoke (servers, ranges, sync, crash-test)
        run: |
          python benchmark.py --quick
        timeout-minutes: 20
