name: ci
on: [push, pull_request]
jobs:
  test:
    # Python 3.9 has no prebuilt x64 toolchain for Ubuntu 26.04 (the
    # current ubuntu-latest). 24.04 is the newest image that still ships
    # 3.9 builds; pin it so the 3.9 matrix leg can resolve.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: compile check
        run: |
          python -m py_compile smolvault.py benchmark.py
      - name: unit tests
        run: |
          python -W ignore -m unittest discover -s tests -t . -v
      - name: quick benchmark smoke (servers, ranges, sync, crash-test)
        run: |
          python benchmark.py --quick --no-write
        timeout-minutes: 20
